name = "cash-flow-x-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
GOOGLE_CLIENT_ID = "997801195831-s33jc14kol6fq38kgkq007erii29q2vm.apps.googleusercontent.com"
# Comma-separated origins allowed to call the API. Add your Pages domain after the first deploy,
# e.g. "https://cash-flow-x.pages.dev,http://localhost:5173"
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:4173,https://cash-flow-x.pages.dev,https://cash-flow-x.avmenon76.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "cash-flow-x"
# Replace with the id printed by `npx wrangler d1 create cash-flow-x`
database_id = "f3b0252b-8b62-4852-93c0-f86680c23599"
migrations_dir = "migrations"

# Per-IP submission limit (Workers rate limiting binding).
[[ratelimits]]
name = "SUBMIT_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
